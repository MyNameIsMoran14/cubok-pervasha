<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="main.css">
  <script src="app.js" defer></script>
  <title>очень сложный тест</title>
</head>
<body>
  <h1>Тесты</h1>

  <!-- 1. с выбором -->
  <div class="question">
    <p>1. Лучший университет мира</p>
    <label><input type="radio" name="q1" value="ДГТУ"> ДГТУ</label><br>
    <label><input type="radio" name="q1" value="МГУ"> МГУ</label><br>
    <label><input type="radio" name="q1" value="СПбГУ"> СПбГУ</label><br><br>

  </div>

  <!-- 2. с выбором -->
  <div class="question">
    <p>2. Сколько окон в главном корпусе?</p>
    <label><input type="radio" name="q2" value="много"> много</label><br>
    <label><input type="radio" name="q2" value="немало"> немало</label><br>
    <label><input type="radio" name="q2" value="дофига"> дофига</label><br><br>

  </div>

  <!-- 3. с выбором -->
  <div class="question">
    <p>3. Лучший мем 2025</p>
    <label><input type="radio" name="q3" value="такси"> МАМА ВЫЗЫВАЙ ТАКСИ</label><br>
    <label><input type="radio" name="q3" value="трл"> ТРАЛЕЛО ТРАЛАЛА</label><br>
    <label><input type="radio" name="q3" value="тун"> ТУН ТУН ТУН САХУР</label><br><br>

  </div>

  <!-- 4. поле ввода -->
  <div class="question">
    <p>4. Вы любите свою маму?</p>
    <input type="text" name="q4" placeholder="Ваш ответ"><br><br>
 
  </div>

  <!-- 5. с выбором -->
  <div class="question">
    <p>5. Любимый цвет</p>
    <label><input type="radio" name="q5" value="красный"> Красный</label><br>
    <label><input type="radio" name="q5" value="синий"> Синий</label><br>
    <label><input type="radio" name="q5" value="зелёный"> Зелёный</label><br><br>
  </div>

  <!-- 6. с выбором -->
  <div class="question">
    <p>6. Любимая еда</p>
    <label><input type="radio" name="q6" value="пицца"> Пицца</label><br>
    <label><input type="radio" name="q6" value="суши"> Суши</label><br>
    <label><input type="radio" name="q6" value="борщ"> Борщ</label><br><br>

  </div>

  <!-- 7. поле ввода -->
  <div class="question">
    <p>7. Ваш любимый фильм</p>
    <input type="text" name="q7" placeholder="Ваш ответ"><br><br>

  </div>

  <!-- 8. поле ввода -->
  <div class="question">
    <p>8. Ваш любимый певец</p>
    <input type="text" name="q8" placeholder="Ваш ответ"><br><br>
   
  </div>

  <!-- 9. с выбором -->
  <div class="question">
    <p>9. Какая сейчас погода?</p>
    <label><input type="radio" name="q9" value="солнечно"> Солнечно</label><br>
    <label><input type="radio" name="q9" value="пасмурно"> Пасмурно</label><br>
    <label><input type="radio" name="q9" value="дождь"> Дождь</label><br><br>

  </div>

  <!-- 10. поле ввода -->
  <div class="question">
    <p>10. Ваши планы на выходные</p>
    <input type="text" name="q10" placeholder="Ваш ответ"><br><br>

  </div>

</body>
</html>
